<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minecraftclone</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="toolbar-container">
      <div id="toolbar">
        <img class="toolbar-icon" src="./assets//textures/grass.png"
          alt="grass icon" id="toolbar-1">
        <img class="toolbar-icon" src="./assets//textures/dirt.png" alt="dirt icon" id="toolbar-2">
        <img class="toolbar-icon" src="./assets//textures/stone.png" alt="grass icon" id="toolbar-3">
        <img class="toolbar-icon" src="./assets//textures/coal_ore.png" alt="coal_ore icon"
          id="toolbar-4">
        <img class="toolbar-icon" src="./assets//textures/iron_ore.png" alt="iron_ore icon"
          id="toolbar-5">
        <img class="toolbar-icon" src="./assets//textures/tree_top.png" alt="tree_top icon"
          id="toolbar-6">
        <img class="toolbar-icon" src="./assets//textures/leaves.png" alt="leaves icon"
          id="toolbar-7">
        <img class="toolbar-icon" src="./assets//textures/sand.png" alt="sand icon" id="toolbar-8">
        <img class="toolbar-icon" src="./assets//textures/pickaxe.png" alt="pickaxe icon"
          id="toolbar-0">
      </div>
    </div>
    <div id="info">
      <div id="player-position"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
